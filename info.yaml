# Proyecto Tiny Tapeout SKY130 - basado en el archivo CircuitVerse del usuario.
project:
  title: "Elevador de 8 niveles"
  author: "Porras"
  discord: ""
  description: "Elevador secuencial de 8 niveles: un piso por ciclo, con 8 LEDs one-hot"
  language: "Verilog"
  # Frecuencia DEMOSTRATIVA: suministra 1 Hz externo para observar cada piso.
  # Cambia este campo si usaras otra frecuencia de reloj real.
  clock_hz: 1
  tiles: "1x1"
  # Idealmente reemplazar por tt_um_TUUSUARIO_elevador antes de enviar.
  top_module: "tt_um_elevador_cv"
  source_files:
    - "project.v"
pinout:
  ui[0]: "T0 (destino bit 0)"
  ui[1]: "T1 (destino bit 1)"
  ui[2]: "T2 (destino bit 2)"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""
  uo[0]: "LED S2"
  uo[1]: "LED S1"
  uo[2]: "LED PB"
  uo[3]: "LED P1"
  uo[4]: "LED P2"
  uo[5]: "LED P3"
  uo[6]: "LED P4"
  uo[7]: "LED P5"
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""
yaml_version: 6
